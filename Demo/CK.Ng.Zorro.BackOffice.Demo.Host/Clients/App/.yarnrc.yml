yarnPath: "./.yarn/releases/yarn-4.18.1.cjs"
approvedGitRepositories:
  - "**"

cacheFolder: ./.yarn/cache

compressionLevel: mixed

enableGlobalCache: false

enableHardenedMode: false

enableMirror: false

enableScripts: true

npmMinimalAgeGate: 0

packageExtensions:
  "ng-zorro-antd@*":
    peerDependencies:
      # CK.Ng.Zorro.ZorroPackage: ng-zorro-antd uses rxjs (through @angular/cdk and @ant-design/icons-angular) but doesn't declare it: without the peer, its CDK is a second instance.
      "rxjs": "*"
