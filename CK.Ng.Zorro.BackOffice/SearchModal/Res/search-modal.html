<div class="ck-search-modal-header">
    <nz-input-wrapper>
        <fa-icon nzInputPrefix [icon]="searchIcon"></fa-icon>
        <input #input nz-input [ngModel]="searchString()" (ngModelChange)="searchString.set($event)" class="search-input" [placeholder]="inputPlaceholder()" />
        <fa-icon nzInputSuffix class="close-icon" [icon]="closeIcon" (click)="clearSearch()"></fa-icon>
    </nz-input-wrapper>
</div>
<div class="ck-search-modal-content">
    @if (searchString().length === 0) {
        @if (defaultContentTemplate()) {
            <ng-container *ngTemplateOutlet="defaultContentTemplate()!" />
        }
    } @else {
        @if (searchResultTemplate()) {
            <ng-container *ngTemplateOutlet="searchResultTemplate()!" />
        }
    }
</div>
